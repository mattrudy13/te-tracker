name: Snapshot odds

on:
  schedule:
    # Times are UTC: Thursday 15:00 (11 AM EDT / 10 AM EST) and Sunday 08:00 (4 AM EDT / 3 AM EST),
    # September through February. GitHub starts scheduled runs late at busy times (4-5 h in October
    # 2026: 21:00 ran at 01:02, after TNF kickoff; 12:00 ran at 16:52, 8 minutes before the 1 PM games),
    # so these leave room for that before TNF and the Sunday London games (13:30 UTC).
    - cron: "0 15 * 9-12,1-2 4"
    - cron: "0 8 * 9-12,1-2 0"
  # hub's cron Worker (hub/worker) also starts this at Thu 10:20 AM and Sun 3:20 AM ET, with
  # source=worker, because GitHub's schedule runs hours late. Run it by hand with source left blank.
  workflow_dispatch:
    inputs:
      source:
        description: "Leave blank. The cron Worker sets 'worker' so a doubled run is skipped."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip, not the commit that triggered the run: a re-run or a run that
      # waited in the concurrency queue would otherwise build on stale data and conflict on push.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The Worker and GitHub's cron both start this job. Each snapshot costs ~45 credits (500 a month),
      # so whichever comes second skips if the last snapshot is under 12 h old. Manual runs always go.
      - name: Skip if a snapshot was just taken
        id: guard
        if: github.event_name == 'schedule' || inputs.source == 'worker'
        run: |
          node -e '
            const fs = require("fs");
            const { current } = JSON.parse(fs.readFileSync("data/seasons.json", "utf8"));
            let takenAt = null;
            try { takenAt = JSON.parse(fs.readFileSync(`data/odds-${current}.json`, "utf8")).takenAt; } catch {}
            const hours = takenAt ? (Date.now() - Date.parse(takenAt)) / 36e5 : Infinity;
            const skip = hours < 12;
            console.log(skip ? `Last snapshot ${hours.toFixed(1)} h ago (${takenAt}): skipping.` : `Last snapshot ${takenAt ?? "none"}: taking one.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          '
      - name: Refresh stats and injuries
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/build-data.mjs
      - name: Fetch odds
        if: steps.guard.outputs.skip != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/fetch-odds.mjs
      - name: Record best-bets picks
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/record-picks.mjs
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
