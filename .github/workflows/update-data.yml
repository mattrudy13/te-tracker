name: Update data

on:
  schedule:
    # Times are UTC. Every 3 hours Thursday–Monday (game days) and a Tuesday morning
    # catch-all after Monday night, September through February.
    - cron: "0 */3 * 9-12,1-2 4,5,6,0,1"
    - cron: "0 10 * 9-12,1-2 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (blank = current)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data
        run: node scripts/build-data.mjs ${{ inputs.season }}
      - name: Grade best-bets picks
        run: node scripts/grade-picks.mjs
      - name: Commit if changed
        run: |
          # `updated` changes on every run, so ignore it when deciding whether anything changed.
          node -e '
            const { execSync } = require("child_process");
            const changed = execSync("git ls-files --modified --others --exclude-standard -- data").toString().split("\n").filter(Boolean);
            if (!changed.length) process.exit(0);
            const strip = (s) => s.replace(/"updated":"[^"]*",?/, "");
            const fs = require("fs");
            const real = changed.some((f) => {
              let old = "";
              try { old = execSync(`git show HEAD:${f}`).toString(); } catch { return true; }
              return strip(old) !== strip(fs.readFileSync(f, "utf8"));
            });
            fs.writeFileSync(process.env.GITHUB_ENV, `DATA_CHANGED=${real}\n`, { flag: "a" });
          '
      - name: Push
        if: env.DATA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
